<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 爪印云</title>
<style>
:root{--bg:#f5f1e8;--ink:#26332e;--muted:#8a938e;--line:#e7dfd1;--pine:#1f6f54;--pine-deep:#144a38;--amber:#e09b2d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg)}
/* 左侧品牌区 */
.hero{flex:1.15;background:linear-gradient(150deg,var(--pine-deep) 0%,var(--pine) 62%,#2c8a68 100%);
  color:#f4f0e6;display:flex;flex-direction:column;justify-content:center;padding:8vh 7vw;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(rgba(244,240,230,.14) 1.6px,transparent 1.6px);background-size:30px 30px}
.hero svg{width:74px;height:74px;margin-bottom:26px}
.hero h1{font-family:"Noto Serif SC","Songti SC","STZhongsong",serif;font-size:42px;letter-spacing:6px;margin:0 0 14px}
.hero p{letter-spacing:2px;font-size:14.5px;opacity:.82;line-height:2;margin:0}
.hero .tag{display:inline-block;margin-top:30px;border:1px solid rgba(244,240,230,.4);border-radius:999px;
  padding:7px 20px;font-size:12px;letter-spacing:3px;opacity:.9}
/* 右侧表单区 */
.panel{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 6vw}
.card{width:100%;max-width:380px;background:#fffdf8;border:1px solid var(--line);border-radius:18px;
  padding:40px 38px;box-shadow:0 18px 44px rgba(38,51,46,.12)}
.card h2{font-family:"Noto Serif SC","Songti SC",serif;letter-spacing:3px;font-size:20px;margin:0 0 6px}
.card .sub{color:var(--muted);font-size:12.5px;letter-spacing:1px;margin:0 0 26px}
.field{margin-bottom:18px}
.field span{display:block;font-size:12px;color:var(--muted);letter-spacing:2px;margin-bottom:6px}
input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;outline:none;transition:.2s}
input:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(31,111,84,.15)}
button.enter{width:100%;margin-top:8px;padding:12px;border:none;border-radius:10px;cursor:pointer;
  background:var(--pine);color:#fff;font-size:15px;letter-spacing:6px;font-family:inherit;transition:.2s}
button.enter:hover{background:var(--pine-deep);transform:translateY(-1px);box-shadow:0 8px 18px rgba(20,74,56,.3)}
.err{background:#fbe9e7;border:1px solid #efc4bf;color:#8f2f28;border-radius:9px;
  padding:9px 14px;font-size:13px;margin-bottom:16px}
.chips{margin-top:26px;padding-top:18px;border-top:1px dashed var(--line)}
.chips p{font-size:11.5px;color:var(--muted);letter-spacing:1px;margin:0 0 10px}
.chip{display:inline-block;background:rgba(31,111,84,.08);border:1px solid #cfe2da;color:#1c5c43;
  border-radius:999px;padding:3px 12px;font-size:11.5px;margin:0 6px 6px 0;letter-spacing:1px}
</style></head>
<body>
<div class="hero">
  <svg viewBox="0 0 64 64" fill="none"><ellipse cx="32" cy="41" rx="13" ry="11" fill="#f4f0e6"/><ellipse cx="15" cy="24" rx="6.5" ry="8.5" transform="rotate(-18 15 24)" fill="#f4f0e6"/><ellipse cx="49" cy="24" rx="6.5" ry="8.5" transform="rotate(18 49 24)" fill="#f4f0e6"/><ellipse cx="26" cy="13" rx="5.5" ry="7.5" fill="#f4f0e6"/><ellipse cx="39" cy="13" rx="5.5" ry="7.5" fill="#f4f0e6"/></svg>
  <h1>爪印云</h1>
  <p>一家门店，一份预约记录 ——<br>宠物主人、前台、客服与店长在同一份业务上协作，<br>让预约结果、付款结果与实际服务相互对应。</p>
  <span class="tag">题目 02 · 宠物门店的预约、接待、服务与取消退款</span>
</div>
<div class="panel"><div class="card">
  <h2>员工 / 用户登录</h2>
  <p class="sub">身份一律来自会话，页面按角色授权</p>
  {{if .Err}}<div class="err">{{.Err}}</div>{{end}}
  <form method="post" action="/login">
    <div class="field"><span>账号</span><input name="username" placeholder="请输入账号" required></div>
    <div class="field"><span>口令</span><input name="password" type="password" placeholder="请输入口令" required></div>
    <button class="enter">进 入 系 统</button>
  </form>
  <div class="chips">
    <p>预置账号 · 口令均为 demo123</p>
    <span class="chip">manager 店长</span><span class="chip">reception 前台</span><span class="chip">staff 服务</span>
    <span class="chip">service 客服</span><span class="chip">u1 / u2 / u3 主人</span>
  </div>
</div></div>
</body></html>
